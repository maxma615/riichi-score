services:
  score:
    build: .
    init: true
    restart: unless-stopped
    ports: ["127.0.0.1:3200:3200"]
    environment:
      APP_ORIGIN: ${APP_ORIGIN:-http://127.0.0.1:3200}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
    volumes: ["score_data:/data"]
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3200'+(process.env.APP_BASE_PATH||'')+'/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
volumes:
  score_data:
